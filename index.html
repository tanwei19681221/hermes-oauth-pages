<h1>Hermes</h1>
<p>Hermes 是一项由账户持有人授权使用的个人自动化服务，用于协助处理 Google Drive 中的文件与资料。</p>
<h2>服务范围</h2>
<p>仅在用户主动发出指令并完成 Google 授权后，Hermes 才会代表该用户访问相应的 Google Drive 资源。服务不面向未授权公众提供文件访问能力。</p>
